<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>付款資訊</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 80px;
        }
        h2 {
            color: #333;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
        }
        img {
            margin-top: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .back {
            display: block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>付款資訊</h2>

        {% if pay_method == '現金' %}
            <p>💵 請至管理室繳交費用。</p>

        {% elif pay_method == 'ATM' %}
            <p>🏦 請使用以下轉帳資訊：</p>
            <p>銀行代碼：000</p>
            <p>銀行帳號：123-456-789-000</p>

        {% elif pay_method == 'LINE Pay' %}
            <p>📱 請使用 LINE Pay 掃描以下 QR Code：</p>
            <img src="{{ url_for('static', filename='linepay_qr.png') }}" alt="LINE Pay 測試 QR Code" width="200">

        {% else %}
            <p>❌ 無效的付款方式。</p>
        {% endif %}

        <form action="/pay" method="post" class="center">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <input type="hidden" name="bill_id" value="{{ bill_id }}">
            <input type="hidden" name="pay_method" value="{{ pay_method }}">
            <input type="hidden" name="pay_amount" value="{{ pay_amount }}">
            <button type="submit">確認</button>
        </form>

        <a href="/" class="back">← 返回主選單</a>
    </div>
</body>
</html>
