<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>繳費紀錄</title>
    <style>
        body { text-align: center; font-family: "Microsoft JhengHei", sans-serif; }
        table { margin: auto; border-collapse: collapse; }
        th, td { border: 1px solid #aaa; padding: 8px 12px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>繳費紀錄</h2>

    {% if payments %}
        <table>
            <tr>
                <th>房號</th>
                <th>住戶</th>
                <th>項目</th>
                <th>金額</th>
                <th>日期</th>
                <th>方式</th>
            </tr>
            {% for p in payments %}
            <tr>
                <!-- p: (RoomNumber, UserName, ItemName, PayAmount, PayDate, PayMethod) -->
                <td>{{ p[2] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[3] }}</td>
                <td>{{ p[4] }}</td>
                <td>{{ p[5] }}</td>
                <td>{{ p[6] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p style="color:gray;">目前沒有繳費紀錄。</p>
    {% endif %}
</body>
</html>
